function setDir(d){tdir=d;document.querySelectorAll(".dsb").forEach(function(b){var on=b.getAttribute("data-d")===d;b.classList.toggle("on",on);b.setAttribute("aria-checked",on?"true":"false")})}
function startQuiz(){
  var cnt=parseInt($("#cnt").value)||1,dir=tdir,only=$("#onlyNew").checked,ts=testedSet();
  var pool=S.words.filter(function(w){return !only||!ts[w.id]});if(!pool.length)pool=S.words;

  var qs=shuf(pool).slice(0,cnt).map(function(w){
    var d=dir==="mix"?(Math.random()<.5?"w2m":"m2w"):dir,f=d==="w2m"?"m":"w",q=d==="w2m"?"w":"m";
    var wr=shuf(S.words.filter(function(x){return x.id!==w.id&&x[f]!==w[f]})),seen={},dis=[];
    var om={};om[w[f]]=w.id;wr.forEach(function(x){if(dis.length<3&&!seen[x[f]]){seen[x[f]]=1;dis.push(x[f]);om[x[f]]=x.id}});
    return{id:w.id,prompt:w[q],ans:w[f],opts:shuf(dis.concat([w[f]])),sel:null,d:d,om:om};
  });

    q.opts.forEach(function(o,j){var cl="opt",ic=LT[j]||"•";
      if(done){if(o===q.ans){cl+=" ok";ic="✓"}else if(o===q.sel){cl+=" no";ic="✕"}else cl+=" dim"}else if(o===q.sel)cl+=" sel";
      s+='<label class="'+cl+'"><input type="radio" name="q'+i+'" '+(o===q.sel?"checked":"")+(done?" disabled":"")+' onchange="pick('+i+','+j+')"><span class="tick">'+ic+'</span><span class="ot'+(oa?' ar':'')+'" dir="auto">'+esc(o)+'</span></label>'});
    s+='</div>';
    if(done&&ww)s+='<div class="rv" id="qd'+i+'" hidden><b><bdi>'+esc(ww.w)+'</bdi></b> — <bdi>'+esc(ww.m)+'</bdi>'+chips(ww)+(ww.note?'<div class="nt">'+esc(ww.note)+'</div>':'')+'</div>';
    return s+'</div>'}).join("");
  if(!done){var a=quiz.qs.filter(function(q){return q.sel!==null}).length;
    h+='<div class="card qbar"><div class="qbi"><span id="qpc">'+bn(a)+' / '+bn(tot)+' উত্তর দেওয়া হয়েছে</span><div class="qpg"><i id="qfl" style="width:'+pct(a,tot)+'%"></i></div></div><span class="row"><button class="btn gh" onclick="if(confirm(\'টেস্ট বাতিল করবেন?\')){quiz=null;render()}">বাতিল</button><button class="btn" onclick="submitQuiz()">সাবমিট করুন</button></span></div>'}
  return h+'</div>';
}
function qd(i){var e=document.getElementById("qd"+i),b=document.getElementById("qp"+i);if(!e)return;e.hidden=!e.hidden;if(b)b.setAttribute("aria-expanded",e.hidden?"false":"true")}
function pick(i,j){var q=quiz.qs[i];q.sel=q.opts[j];var a=quiz.qs.filter(function(x){return x.sel!==null}).length;
  document.querySelectorAll('input[name="q'+i+'"]').forEach(function(e,k){e.parentNode.classList.toggle("sel",k===j)});
  var t=$("#qpc"),f=$("#qfl");if(t)t.textContent=bn(a)+" / "+bn(quiz.qs.length)+" উত্তর দেওয়া হয়েছে";if(f)f.style.width=pct(a,quiz.qs.length)+"%"}
function submitQuiz(){
  var un=quiz.qs.filter(function(q){return q.sel===null}).length;
  if(un&&!confirm(bn(un)+"টি প্রশ্নের উত্তর দেওয়া হয়নি। এগুলো ভুল ধরে সাবমিট করবেন?"))return;
  var c=quiz.qs.filter(function(q){return q.sel===q.ans}).length,now=new Date();
  S.results.push({id:uid(),at:now.toISOString(),day:dayKey(now),total:quiz.qs.length,correct:c,ids:quiz.qs.map(function(q){return q.id})});
  save();quiz.done=true;quiz.res={correct:c};render();
}
load();norm();uBase=snapS();applyFonts();render();ubtn();
</script>
